name: radar-concursos
on:
  schedule: [{ cron: '23 10 * * *' }]   # todo dia às 7h23 de Brasília
  workflow_dispatch:
permissions: { contents: write, issues: write }
concurrency: { group: escrita-main, cancel-in-progress: false }
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 radar/radar.py
      - name: Abre issue com os concursos novos (rótulo radar, neste repositório)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh label create radar --color 0E8A16 --description "Concursos novos encontrados pelo radar" 2>/dev/null || true
          if [ -s radar/novos.md ]; then
            gh issue create --title "Radar de concursos: novidades de $(date +%d/%m/%Y)" --body-file radar/novos.md --label radar
          fi
      - run: |
          git config user.name robo; git config user.email robo@users.noreply.github.com
          git add radar/vistos.json radar/novos.md
          git commit -m "radar de concursos: $(date +%d/%m/%Y)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
